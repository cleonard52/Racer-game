
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Racer - Curved Roads</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #151923;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

h1 {
    margin: 15px 0 8px;
    color: #38f59b;
    letter-spacing: 3px;
}

#hud {
    width: min(400px, 100vw);
    display: flex;
    justify-content: space-around;
    padding: 10px;
    font-weight: bold;
}

#gameContainer {
    position: relative;
    width: min(400px, 100vw);
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #176b37;
    border: 3px solid #687080;
}

#overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

#overlay h2 {
    font-size: 34px;
    color: #38f59b;
    margin-bottom: 10px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    background: #38f59b;
    color: #111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

button:hover { background: #15d77c; }

button:active { transform: scale(.97); }

#controls {
    display: flex;
    justify-content: center;
    gap: 45px;
    margin: 12px 0;
}

.controlBtn {
    width: 80px;
    height: 55px;
    font-size: 25px;
    padding: 0;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

p {
    color: #c6ccda;
    text-align: center;
    padding: 0 10px;
}

@media (max-width: 400px) {
    h1 { font-size: 25px; }
    #controls { gap: 30px; }
}
</style>
</head>
<body>

<h1>NEON RACER</h1>

<div id="hud">
    <span>🏁 Score: <span id="score">0</span></span>
    <span>⚡ Speed: <span id="speed">5</span></span>
</div>

<div id="gameContainer">
    <canvas id="game" width="400" height="600"></canvas>

    <div id="overlay">
        <h2 id="message">NEON RACER</h2>
        <p id="instructions">
            Dodge traffic on winding roads!
            <br><br>
            Use WASD or arrow keys to drive.
        </p>
        <button id="startBtn">START RACE</button>
    </div>
</div>

<div id="controls">
    <button class="controlBtn" id="leftBtn"
        aria-label="Steer left">◀</button>
    <button class="controlBtn" id="rightBtn"
        aria-label="Steer right">▶</button>
</div>

<p>Arrow keys / WASD • Avoid traffic and follow the curves!</p>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreDisplay = document.getElementById("score");
const speedDisplay = document.getElementById("speed");
const overlay = document.getElementById("overlay");
const message = document.getElementById("message");
const instructions = document.getElementById("instructions");
const startBtn = document.getElementById("startBtn");

const W = canvas.width;
const H = canvas.height;

const roadWidth = 270;
const roadCenter = W / 2;
const laneWidth = roadWidth / 3;

let player;
let enemies = [];
let score = 0;
let roadOffset = 0;
let spawnTimer = 0;
let running = false;
let animationId = null;
let lastTime = 0;
let distance = 0;
let curveStrength = 0;
let targetCurve = 0;
let curveTimer = 0;

const keys = {
    left: false,
    right: false,
    up: false,
    down: false
};

const carColors = [
    "#ff4242",
    "#42a5ff",
    "#ffd447",
    "#d66bff",
    "#ff8a3d"
];

// One shared curve function keeps road geometry consistent.
function roadCurveAt(y) {
    const horizon = distance * 0.0008;
    const perspective = (H - y) / H;

    return (
        Math.sin(horizon + (H - y) * 0.003) *
            curveStrength * perspective +
        Math.sin(horizon * 0.55 + (H - y) * 0.0015) *
            10 * perspective
    );
}

function roadX(y) {
    return roadCenter + roadCurveAt(y);
}

// Calculate the vertical screen position of a scrolling object.
// Handles negative values and wraparound correctly.
function scrollY(y, offset, period = H) {
    return ((y + offset) % period + period) % period;
}

function releaseAllControls() {
    keys.left = false;
    keys.right = false;
    keys.up = false;
    keys.down = false;
}

function resetGame() {
    player = {
        x: roadCenter - 18,
        y: H - 115,
        width: 36,
        height: 62,
        color: "#38f59b"
    };

    enemies = [];
    score = 0;
    roadOffset = 0;
    spawnTimer = 0;
    distance = 0;
    curveStrength = 0;
    targetCurve = 0;
    curveTimer = 0;
    lastTime = 0;

    releaseAllControls();

    scoreDisplay.textContent = "0";
    speedDisplay.textContent = "5";

    message.textContent = "NEON RACER";
    instructions.innerHTML =
        "Dodge traffic on winding roads!" +
        "<br><br>Use WASD or arrow keys to drive.";

    startBtn.textContent = "START RACE";
}

function drawCar(x, y, width, height, color) {
    // Wheels
    ctx.fillStyle = "#111";
    ctx.fillRect(x - 4, y + 10, 6, 15);
    ctx.fillRect(x + width - 2, y + 10, 6, 15);
    ctx.fillRect(x - 4, y + height - 25, 6, 15);
    ctx.fillRect(x + width - 2, y + height - 25, 6, 15);

    // Body
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);

    // Windows
    ctx.fillStyle = "#a9e8ff";
    ctx.fillRect(x + 5, y + 10, width - 10, 14);
    ctx.fillRect(x + 5, y + height - 23, width - 10, 11);

    // Headlights
    ctx.fillStyle = "#fff5a0";
    ctx.fillRect(x + 3, y + 2, 8, 4);
    ctx.fillRect(x + width - 11, y + 2, 8, 4);

    // Tail lights
    ctx.fillStyle = "#ff3333";
    ctx.fillRect(x + 3, y + height - 5, 8, 4);
    ctx.fillRect(x + width - 11, y + height - 5, 8, 4);
}

function drawRoad() {
    // Grass
    ctx.fillStyle = "#176b37";
    ctx.fillRect(0, 0, W, H);

    // Decorative grass dashes
    ctx.fillStyle = "#208446";

    for (let y = -30; y < H + 65; y += 65) {
        const sy = scrollY(y, roadOffset * 1.5, H + 65);

        ctx.fillRect(12, sy, 15, 3);
        ctx.fillRect(W - 28, sy, 15, 3);
    }

    // Curved road surface
    ctx.beginPath();

    for (let y = 0; y <= H; y += 3) {
        const x = roadX(y) - roadWidth / 2;

        if (y === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }

    for (let y = H; y >= 0; y -= 3) {
        ctx.lineTo(roadX(y) + roadWidth / 2, y);
    }

    ctx.closePath();
    ctx.fillStyle = "#343943";
    ctx.fill();

    // Curbs use the same road geometry and scroll phase.
    for (let y = 0; y < H; y += 18) {
        const yy = scrollY(y, roadOffset * 1.4, H);
        const center = roadX(yy);

        const stripe =
            Math.floor((y + roadOffset * 1.4) / 18) % 2 === 0;

        ctx.fillStyle = stripe ? "#ff4545" : "#ffffff";

        ctx.fillRect(
            center - roadWidth / 2 - 7,
            yy,
            7,
            18
        );

        ctx.fillRect(
            center + roadWidth / 2,
            yy,
            7,
            18
        );
    }

    // Lane markings: calculate the road center at each segment.
    ctx.fillStyle = "#f5f5f5";

    for (let lane = 1; lane <= 2; lane++) {
        for (let y = -100; y < H + 100; y += 100) {
            const yy = scrollY(y, roadOffset * 1.6, H + 100);
            const center = roadX(yy);
            const x = center - roadWidth / 2 + lane * laneWidth;

            ctx.fillRect(x - 2, yy, 4, 48);
        }
    }
}

function spawnEnemy() {
    const lane = Math.floor(Math.random() * 3);
    const carWidth = 36;
    const carHeight = 62;
    const y = -carHeight - 5;

    const center = roadX(y);
    const leftEdge = center - roadWidth / 2;

    enemies.push({
        x: leftEdge + lane * laneWidth +
            (laneWidth - carWidth) / 2,
        y,
        width: carWidth,
        height: carHeight,
        color: carColors[
            Math.floor(Math.random() * carColors.length)
        ],
        speed: 2 + Math.random() * 2,
        lane
    });
}

function collides(a, b) {
    return (
        a.x + 5 < b.x + b.width - 5 &&
        a.x + a.width - 5 > b.x + 5 &&
        a.y + 7 < b.y + b.height - 7 &&
        a.y + a.height - 7 > b.y + 7
    );
}

function update(delta) {
    const dt = Math.min(delta / 16.67, 2);
    const roadSpeed = 5 + Math.min(score / 250, 5);
    const moveSpeed = 5.5 * dt;

    distance += roadSpeed * dt;
    roadOffset = (roadOffset + roadSpeed * dt) % H;

    // Change bends smoothly.
    curveTimer -= delta;

    if (curveTimer <= 0) {
        targetCurve = (Math.random() * 2 - 1) * 45;
        curveTimer = 1800 + Math.random() * 2400;
    }

    curveStrength +=
        (targetCurve - curveStrength) *
        Math.min(0.012 * dt, 1);

    // Player steering.
    if (keys.left) player.x -= moveSpeed;
    if (keys.right) player.x += moveSpeed;
    if (keys.up) player.y -= moveSpeed;
    if (keys.down) player.y += moveSpeed;

    player.y = Math.max(
        10,
        Math.min(H - player.height - 10, player.y)
    );

    // Keep the player within the road at their current position.
    const center = roadX(player.y + player.height / 2);
    const leftEdge = center - roadWidth / 2 + 12;
    const rightEdge =
        center + roadWidth / 2 - player.width - 12;

    player.x = Math.max(
        leftEdge,
        Math.min(rightEdge, player.x)
    );

    // Spawn traffic.
    spawnTimer += delta;
    const spawnInterval = Math.max(420, 1050 - score * 2);

    if (spawnTimer >= spawnInterval) {
        spawnEnemy();
        spawnTimer %= spawnInterval;
    }

    // Move traffic and keep each car in its assigned lane.
    for (const enemy of enemies) {
        enemy.y += (roadSpeed + enemy.speed) * dt;

        const enemyCenter = roadX(enemy.y);
        const roadLeft = enemyCenter - roadWidth / 2;

        enemy.x =
            roadLeft +
            enemy.lane * laneWidth +
            (laneWidth - enemy.width) / 2;

        if (collides(player, enemy)) {
            endGame();
            return;
        }
    }

    // Award points for traffic passed.
    const passed = enemies.filter(
        enemy => enemy.y > H
    ).length;

    enemies = enemies.filter(
        enemy => enemy.y <= H
    );

    score += passed * 10 + delta * 0.006;

    scoreDisplay.textContent = Math.floor(score);
    speedDisplay.textContent = Math.floor(roadSpeed);
}

function draw() {
    drawRoad();

    for (const enemy of enemies) {
        drawCar(
            enemy.x,
            enemy.y,
            enemy.width,
            enemy.height,
            enemy.color
        );
    }

    if (player) {
        drawCar(
            player.x,
            player.y,
            player.width,
            player.height,
            player.color
        );
    }
}

function gameLoop(timestamp) {
    if (!running) return;

    const delta = lastTime
        ? Math.min(timestamp - lastTime, 50)
        : 16.67;

    lastTime = timestamp;

    update(delta);

    if (!running) return;

    draw();
    animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
    if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    resetGame();
    running = true;
    lastTime = 0;

    overlay.style.display = "none";

    draw();
    animationId = requestAnimationFrame(gameLoop);
}

function endGame() {
    if (!running) return;

    running = false;

    if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    releaseAllControls();

    message.textContent = "CRASH!";

    instructions.innerHTML =
        "Final Score: " + Math.floor(score) +
        "<br><br>Try again and beat your record!";

    startBtn.textContent = "RACE AGAIN";
    overlay.style.display = "flex";
}

startBtn.addEventListener("click", startGame);

// Keyboard controls.
document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if (
        ["arrowleft", "arrowright", "arrowup",
         "arrowdown", " "].includes(key)
    ) {
        event.preventDefault();
    }

    if (key === "arrowleft" || key === "a") keys.left = true;
    if (key === "arrowright" || key === "d") keys.right = true;
    if (key === "arrowup" || key === "w") keys.up = true;
    if (key === "arrowdown" || key === "s") keys.down = true;
});

document.addEventListener("keyup", event => {
    const key = event.key.toLowerCase();

    if (key === "arrowleft" || key === "a") keys.left = false;
    if (key === "arrowright" || key === "d") keys.right = false;
    if (key === "arrowup" || key === "w") keys.up = false;
    if (key === "arrowdown" || key === "s") keys.down = false;
});

// Prevent stuck keys when the browser loses focus.
function releaseAllControlsOnBlur() {
    releaseAllControls();
}

window.addEventListener("blur", releaseAllControlsOnBlur);

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        releaseAllControls();
    }
});

// Mobile touch controls.
function bindButton(id, key) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", event => {
        event.preventDefault();

        keys[key] = true;

        if (button.setPointerCapture) {
            button.setPointerCapture(event.pointerId);
        }
    });

    function release(event) {
        if (event) event.preventDefault();
        keys[key] = false;
    }

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);

    button.addEventListener("contextmenu", event => {
        event.preventDefault();
    });
}

bindButton("leftBtn", "left");
bindButton("rightBtn", "right");

// Initial screen.
resetGame();
draw();
</script>
</body>
</html>
